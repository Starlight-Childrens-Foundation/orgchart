<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starlight Children's Foundation — Org Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --blue:      #0071CE;
  --blue-dark: #0060AF;
  --blue-light:#33A3FF;
  --blue-pale: #E6F3FF;
  --yellow:    #FFDD00;
  --bg:        #EDEFF2;
  --white:     #FFFFFF;
  --text:      #0D2340;
  --text-dim:  #4A6585;
  --muted:     #8A9BB5;
  --border:    #D8DEE8;
  --card-shadow: 0 1px 4px rgba(0,0,0,0.10), 0 0 0 1px rgba(0,0,0,0.05);
  --disc-d:#E03030; --disc-i:#F57C00; --disc-s:#2E9E5A; --disc-c:#0071CE;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:100%; height:100%; overflow:hidden; font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); }

/* ── HEADER ── */
#header {
  position:fixed; top:0; left:0; right:0; z-index:200;
  height:56px; display:flex; align-items:center; gap:14px; padding:0 22px;
  background:var(--blue); box-shadow:0 2px 10px rgba(0,96,175,0.28);
}
#header h1 { font-size:1.05rem; font-weight:800; color:var(--yellow); white-space:nowrap; }
#header p  { font-size:0.63rem; color:rgba(255,255,255,0.65); text-transform:uppercase; letter-spacing:0.07em; white-space:nowrap; font-weight:600; }
.h-sep { width:1px; height:24px; background:rgba(255,255,255,0.2); flex-shrink:0; }

/* ── TOOLBAR ── */
#toolbar {
  position:fixed; top:56px; left:0; right:0; z-index:199;
  padding:6px 18px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;
  background:var(--blue-dark); border-bottom:2px solid var(--yellow);
}
.filter-btn {
  padding:3px 10px; border-radius:20px; border:1px solid rgba(255,255,255,0.22);
  background:transparent; color:rgba(255,255,255,0.72); font-family:'Nunito',sans-serif;
  font-size:0.67rem; font-weight:600; cursor:pointer; transition:all 0.15s; white-space:nowrap;
}
.filter-btn:hover { background:rgba(255,255,255,0.14); color:white; }
.filter-btn.active { background:var(--yellow); border-color:var(--yellow); color:var(--blue-dark); font-weight:800; }
.tb-sep { flex:1; }
.zoom-btn {
  width:26px; height:26px; border-radius:6px; border:1px solid rgba(255,255,255,0.22);
  background:transparent; color:white; font-size:1rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:background 0.13s;
}
.zoom-btn:hover { background:rgba(255,255,255,0.14); }
#zoom-lbl { font-size:0.67rem; color:rgba(255,255,255,0.65); min-width:34px; text-align:center; font-weight:600; }
.tb-hint { font-size:0.61rem; color:rgba(255,255,255,0.45); font-weight:500; }
#disc-legend { display:flex; gap:9px; align-items:center; }
.dl-item { display:flex; align-items:center; gap:3px; font-size:0.61rem; color:rgba(255,255,255,0.78); font-weight:600; }
.dl-dot  { width:13px; height:13px; border-radius:50%; font-size:0.5rem; font-weight:800; color:white; display:flex; align-items:center; justify-content:center; }

/* ── STAGE ── */
#stage { position:fixed; inset:0; top:98px; overflow:hidden; cursor:grab; background:var(--bg); }
#stage.dragging { cursor:grabbing; }
#world { position:absolute; transform-origin:0 0; will-change:transform; padding:60px 80px; }

/* ── TREE STRUCTURE ── */
.tree-root  { display:flex; flex-direction:column; align-items:center; }
.tree-node  { display:flex; flex-direction:column; align-items:center; }
.children-row { display:flex; flex-direction:row; align-items:flex-start; gap:0; }
.child-col  { display:flex; flex-direction:column; align-items:center; }

/* ── CONNECTOR LINES ── */
.connector-v { width:1px; background:var(--border); flex-shrink:0; }
.connector-h-wrap { display:flex; align-items:flex-start; width:100%; }
.connector-h { height:1px; background:var(--border); flex:1; }
.connector-h.left  { border-radius:0; }
.connector-h.right { border-radius:0; }
.connector-h.hide  { background:transparent; }
.connector-node-v  { width:1px; background:var(--border); margin:0 auto; }

/* ── DEPARTMENT GROUP CARD ── */
.dept-card {
  background:var(--white); border-radius:8px;
  box-shadow:var(--card-shadow);
  min-width:200px; max-width:220px;
  overflow:hidden; flex-shrink:0;
}
.dept-card-header {
  padding:10px 12px 8px;
  border-top:3px solid var(--blue);
}
.dept-card-header.c-exec  { border-color:#7C6FCD; }
.dept-card-header.c-ig    { border-color:#7C6FCD; }
.dept-card-header.c-mc    { border-color:#0071CE; }
.dept-card-header.c-part  { border-color:#2E9E5A; }
.dept-card-header.c-fin   { border-color:#E8B84B; }
.dept-card-header.c-miss  { border-color:#0071CE; }
.dept-card-header.c-acct  { border-color:#7C6FCD; }
.dept-card-header.c-ops   { border-color:#E8B84B; }
.dept-name { font-size:0.78rem; font-weight:700; color:var(--text); line-height:1.2; }
.dept-count { font-size:0.68rem; font-weight:700; color:var(--muted); float:right; margin-top:1px; }

/* ── PERSON CARD ── */
.person-card {
  background:var(--white); border-radius:8px;
  box-shadow:var(--card-shadow);
  min-width:200px; max-width:220px; width:220px;
  overflow:hidden; cursor:pointer; flex-shrink:0;
  transition:box-shadow 0.15s, transform 0.15s;
  position:relative;
}
.person-card:hover {
  box-shadow:0 4px 16px rgba(0,113,206,0.2), 0 0 0 1.5px var(--blue-light);
  transform:translateY(-1px);
}
.person-card-top {
  padding:10px 12px 8px;
  border-top:3px solid transparent;
}
/* Dept color top borders on person cards */
.person-card.c-exec .person-card-top  { border-color:#7C6FCD; }
.person-card.c-ig .person-card-top    { border-color:#7C6FCD; }
.person-card.c-mc .person-card-top    { border-color:#0071CE; }
.person-card.c-part .person-card-top  { border-color:#2E9E5A; }
.person-card.c-fin .person-card-top   { border-color:#E8B84B; }
.person-card.c-miss .person-card-top  { border-color:#0071CE; }
.person-card.c-acct .person-card-top  { border-color:#7C6FCD; }
.person-card.c-ops .person-card-top   { border-color:#E8B84B; }

.person-role { font-size:0.68rem; font-weight:700; color:var(--text); line-height:1.3; margin-bottom:8px; }
.person-info-row { display:flex; align-items:center; gap:10px; }
.person-photo {
  width:44px; height:44px; border-radius:6px; object-fit:cover;
  flex-shrink:0; background:var(--bg);
  border:1px solid var(--border);
}
.person-details { flex:1; min-width:0; }
.person-name { font-size:0.72rem; font-weight:700; color:var(--text); line-height:1.25; }
.person-email { font-size:0.6rem; color:var(--text-dim); font-weight:500; margin-top:1px; }

/* LT badge */
.lt-badge {
  display:inline-block; font-size:0.52rem; font-weight:800;
  background:var(--blue); color:white;
  padding:1px 5px; border-radius:4px; margin-left:5px;
  vertical-align:middle; letter-spacing:0.03em;
}

/* DISC badge */
.disc-badge {
  display:inline-flex; align-items:center; justify-content:center;
  width:17px; height:17px; border-radius:50%;
  font-size:0.48rem; font-weight:800; color:white;
  margin-left:4px; vertical-align:middle; letter-spacing:-0.5px; flex-shrink:0;
}
.db-D  { background:var(--disc-d); }
.db-I, .db-i { background:var(--disc-i); }
.db-S  { background:var(--disc-s); }
.db-C  { background:var(--disc-c); }
.db-Di { background:linear-gradient(135deg,var(--disc-d),var(--disc-i)); }
.db-Si { background:linear-gradient(135deg,var(--disc-s),var(--disc-i)); }
.db-DC { background:linear-gradient(135deg,var(--disc-d),var(--disc-c)); }
.db-SC { background:linear-gradient(135deg,var(--disc-s),var(--disc-c)); }
.db-CD { background:linear-gradient(135deg,var(--disc-c),var(--disc-d)); }

/* Expand/collapse footer */
.card-footer {
  padding:5px 12px; border-top:1px solid #EDF0F5;
  display:flex; align-items:center; justify-content:flex-end; gap:4px;
  font-size:0.62rem; font-weight:700; color:var(--muted); cursor:pointer;
  user-select:none; transition:color 0.13s;
}
.card-footer:hover { color:var(--blue); }
.card-footer .cf-arrow { font-size:0.7rem; transition:transform 0.2s; }
.card-footer.expanded .cf-arrow { transform:rotate(180deg); }

/* Hidden subtree */
.subtree.collapsed { display:none; }

/* ── HOVER TOOLTIP ── */
#tooltip {
  position:fixed; z-index:600; background:white;
  border:2px solid var(--blue); border-radius:12px;
  padding:13px 15px; pointer-events:none; max-width:270px;
  opacity:0; transition:opacity 0.13s;
  box-shadow:0 8px 28px rgba(0,96,175,0.18);
  font-family:'Nunito',sans-serif;
}
#tooltip.show { opacity:1; }
#tooltip .tt-name { font-size:0.9rem; font-weight:800; color:var(--blue); margin-bottom:2px; }
#tooltip .tt-job  { font-size:0.66rem; color:var(--text); line-height:1.4; margin-bottom:6px; font-weight:600; }
#tooltip .tt-meta { font-size:0.62rem; color:var(--text-dim); margin-bottom:2px; font-weight:500; }
#tooltip .tt-meta b { color:var(--blue-dark); font-weight:700; }
#tooltip hr { border:none; border-top:1px solid #EDF0F5; margin:7px 0 6px; }
#tooltip .tt-rlabel { font-size:0.57rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--blue); font-weight:800; margin-bottom:5px; }
#tooltip .tt-ri { display:flex; gap:5px; font-size:0.62rem; color:var(--text-dim); line-height:1.4; margin-bottom:3px; font-weight:500; }
#tooltip .tt-ri::before { content:'›'; color:var(--blue); flex-shrink:0; font-weight:800; }
#tooltip .tt-hint { margin-top:8px; font-size:0.57rem; color:var(--muted); font-weight:600; font-style:italic; }

/* ── DISC MODAL ── */
#modal-overlay {
  position:fixed; inset:0; z-index:800;
  background:rgba(0,48,100,0.42); backdrop-filter:blur(4px);
  display:none; align-items:center; justify-content:center;
}
#modal-overlay.open { display:flex; }
#modal {
  background:white; border-radius:16px; padding:26px 26px 22px;
  max-width:400px; width:90%;
  box-shadow:0 20px 60px rgba(0,96,175,0.22);
  position:relative; font-family:'Nunito',sans-serif;
  animation:mIn 0.18s ease;
}
@keyframes mIn { from{transform:scale(0.93) translateY(8px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }
#modal-close { position:absolute; top:13px; right:15px; background:none; border:none; font-size:1.25rem; cursor:pointer; color:var(--muted); }
#modal-close:hover { color:var(--text); }
.m-avatar-row { display:flex; align-items:center; gap:13px; margin-bottom:16px; }
.m-avatar { width:54px; height:54px; border-radius:8px; object-fit:cover; border:2px solid var(--blue); background:var(--bg); flex-shrink:0; }
.m-name  { font-size:1.05rem; font-weight:800; color:var(--text); }
.m-title { font-size:0.7rem; color:var(--blue-dark); font-weight:600; margin-top:2px; }
.disc-card { border-radius:10px; padding:14px 16px; }
.disc-card-hdr { display:flex; align-items:center; gap:11px; margin-bottom:11px; }
.disc-big { width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1rem; font-weight:900; color:white; flex-shrink:0; letter-spacing:-1px; }
.disc-sname { font-size:0.95rem; font-weight:800; }
.disc-ssub  { font-size:0.68rem; font-weight:600; color:var(--text-dim); margin-top:1px; }
.disc-desc  { font-size:0.72rem; color:var(--text); line-height:1.6; font-weight:500; }
.disc-traits { display:flex; flex-wrap:wrap; gap:5px; margin-top:11px; }
.disc-trait  { padding:3px 9px; border-radius:20px; font-size:0.61rem; font-weight:700; }

/* ── MINIMAP ── */
#minimap {
  position:fixed; bottom:14px; right:14px; z-index:300;
  width:140px; height:80px; background:white;
  border:1.5px solid var(--border); border-radius:7px;
  overflow:hidden; cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}
#minimap canvas { width:100%; height:100%; display:block; }

/* ── EXPAND ALL btn ── */
#expand-all-btn {
  position:fixed; bottom:16px; left:16px; z-index:300;
  padding:7px 16px; border-radius:20px; border:none;
  background:white; color:var(--text); font-family:'Nunito',sans-serif;
  font-size:0.72rem; font-weight:700; cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,0.12);
  display:flex; align-items:center; gap:5px; transition:background 0.14s;
}
#expand-all-btn:hover { background:var(--blue-pale); color:var(--blue); }
/* ── OC TREE CONNECTORS ── */
.oc-tree { display:flex; justify-content:center; padding:20px; }
.oc-node { display:flex; flex-direction:column; align-items:center; }
.oc-subtree { display:flex; flex-direction:column; align-items:center; }
.oc-vline-down { width:1px; height:20px; background:var(--border); flex-shrink:0; }

/* Single child - no horizontal bar */
.oc-children-single { display:flex; flex-direction:column; align-items:center; }

/* Horizontal children row with T-connectors */
.oc-children-h { display:flex; flex-direction:row; align-items:flex-start; position:relative; }
.oc-children-h::before {
  content:""; position:absolute; top:0; left:0; right:0;
  height:1px; background:var(--border);
}
.oc-col { display:flex; flex-direction:column; align-items:center; padding:0 14px; position:relative; }
.oc-col::before { content:""; width:1px; height:20px; background:var(--border); flex-shrink:0; }
/* First col: hide the left half of the bar (no line to the left of first child) */
.oc-col-first::after {
  content:""; position:absolute; top:0; left:0; width:50%;
  height:1px; background:var(--bg);
}
/* Last col: hide the right half of the bar (no line to the right of last child) */
.oc-col-last::after {
  content:""; position:absolute; top:0; right:0; width:50%;
  height:1px; background:var(--bg);
}

/* Vertical children */
.oc-children-v { display:flex; flex-direction:column; align-items:flex-start; }
.oc-row-v { display:flex; flex-direction:column; align-items:flex-start; }
.oc-row-v::before { content:""; width:1px; height:14px; background:var(--border); flex-shrink:0; }
</style>
</head>

// ── BUILD HTML ────────────────────────────────────────────────────────────────
// Strategy: pure CSS tree with inline connector lines using borders/flex.
// Each node is a flex column: [card] + [vert-line] + [children-row]
// Children row is flex row: each child wrapped in a column with top connector
// This means connectors are part of layout and expand automatically.

const world = document.getElementById('world');
let nc = 0;

function discBadge(name) {
  const s = DISC_STYLES[name]; if (!s) return '';
  const cls = {D:'db-D',I:'db-I',i:'db-i',S:'db-S',C:'db-C',Di:'db-Di',Si:'db-Si',DC:'db-DC',SC:'db-SC',CD:'db-CD'}[s]||'db-D';
  return `<span class="disc-badge ${cls}">${s}</span>`;
}

// Returns HTML for a person card + its collapsible subtree
// layout: 'h' = children horizontal, 'v' = children vertical
function nodeHtml(person, layout='h') {
  const id   = nc++;
  const sid  = 'sub'+id;
  const ftid = 'ft'+id;
  const ch   = person.children||[];
  const hasK = ch.length>0;
  const dc   = DEPT_COLOR[person.dept]||'';
  const lt   = LT_PEOPLE.has(person.name)?`<span class="lt-badge">LT</span>`:'';
  const disc = discBadge(person.name);
  const av   = AVATARS[person.name]||'';
  const fb   = `https://ui-avatars.com/api/?name=${encodeURIComponent(person.name)}&background=0071CE&color=fff&size=54`;
  const safe = person.name.replace(/'/g,"&#39;");

  const footer = hasK
    ? `<div class="card-footer" id="${ftid}" onclick="tog('${sid}','${ftid}',event)">
        <span>${ch.length} report${ch.length>1?'s':''}</span><span class="cf-arrow">∨</span>
       </div>` : '';

  const card = `<div class="person-card ${dc}"
      onmouseenter="showTip(event,'${safe}')" onmousemove="moveTip(event)" onmouseleave="hideTip()"
      onclick="showModal('${safe}')">
    <div class="person-card-top">
      <div class="person-role">${person.role}</div>
      <div class="person-info-row">
        <img class="person-photo" src="${av}" onerror="this.src='${fb}'">
        <div class="person-details"><div class="person-name">${person.name}${lt}${disc}</div></div>
      </div>
    </div>${footer}</div>`;

  if (!hasK) return `<div class="oc-node">${card}</div>`;

  // Children HTML
  let childrenHtml;
  if (layout === 'h') {
    // Horizontal: children side by side with T-connectors
    const cols = ch.map(c => {
      const childLayout = (c.children&&c.children.length) ? 'v' : 'h';
      const inner = nodeHtml(c, childLayout);
      return `<div class="oc-col">${inner}</div>`;
    }).join('');
    childrenHtml = `<div class="oc-children-h">${cols}</div>`;
  } else {
    // Vertical: children stacked
    const rows = ch.map(c => {
      const inner = nodeHtml(c, 'v');
      return `<div class="oc-row-v">${inner}</div>`;
    }).join('');
    childrenHtml = `<div class="oc-children-v">${rows}</div>`;
  }

  return `<div class="oc-node">
    ${card}
    <div id="${sid}" class="oc-subtree" style="display:none;">
      <div class="oc-vline-down"></div>
      ${childrenHtml}
    </div>
  </div>`;
}

// Dept header + person below
function deptHtml(dept, personNode) {
  const dc = dept.color||'';
  const header = `<div class="dept-card">
    <div class="dept-card-header ${dc}">
      <span class="dept-count">${dept.count}</span>
      <div class="dept-name">${dept.deptHeader}</div>
    </div></div>`;
  const personH = nodeHtml(personNode, 'h');
  return `<div class="oc-node">
    ${header}
    <div class="oc-subtree" style="display:block;">
      <div class="oc-vline-down"></div>
      <div class="oc-children-single">${personH}</div>
    </div>
  </div>`;
}

// Full tree:
//              [Adam]
//                 |
//    _____________|____________________
//    |                |               |
//  [Wally]        [Cindee]         [Mike]
//    |          Marketing & Comms  Finance & Ops
//  __|_____
//  |       |
// [IG] [Partners]
function buildTree() {
  const igDept   = TREE.children[0]; // Individual Giving
  const partDept = TREE.children[1]; // Partnerships
  const mktDept  = TREE.children[2]; // Marketing & Communications

  // Wally node: card + always-visible IG + Partnerships below
  const wallyDeptCols = [igDept, partDept].map((dept, i, arr) => {
    const personNode = dept.children[0];
    const cls = i===0 ? 'oc-col oc-col-first' : i===arr.length-1 ? 'oc-col oc-col-last' : 'oc-col';
    return `<div class="${cls}">${deptHtml(dept, personNode)}</div>`;
  }).join('');

  const wallyNode = `<div class="oc-node">
    ${wallyHtml()}
    <div class="oc-subtree" style="display:block;">
      <div class="oc-vline-down"></div>
      <div class="oc-children-h">${wallyDeptCols}</div>
    </div>
  </div>`;

  // Cindee node: Marketing & Comms dept header + Cindee card
  const cindeeNode = deptHtml(mktDept, mktDept.children[0]);

  // Finance & Ops (Mike)
  const finNode = finHtml();

  // All three sit in a horizontal row directly under Adam
  const adamChildren = `<div class="oc-children-h">
    <div class="oc-col oc-col-first">${wallyNode}</div>
    <div class="oc-col">${cindeeNode}</div>
    <div class="oc-col oc-col-last">${finNode}</div>
  </div>`;

  return `<div class="oc-tree">
    <div class="oc-node">
      ${adamHtml()}
      <div class="oc-subtree" style="display:block;">
        <div class="oc-vline-down"></div>
        ${adamChildren}
      </div>
    </div>
  </div>`;
}

world.innerHTML = buildTree();

// ── EXPAND / COLLAPSE ─────────────────────────────────────────────────────────
let allExpanded = false;
let homeT = {tx:0,ty:0,sc:0.87};

function animateTo(targetTx, targetTy, targetSc, duration=400) {
  const s0=sc,tx0=tx,ty0=ty,t0=performance.now();
  function ease(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}
  function step(now){
    const p=Math.min((now-t0)/duration,1),e=ease(p);
    tx=tx0+(targetTx-tx0)*e; ty=ty0+(targetTy-ty0)*e; sc=s0+(targetSc-s0)*e;
    applyT(); if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function goHome(){animateTo(homeT.tx,homeT.ty,homeT.sc);}

function tog(subtreeId, footerId, event) {
  event.stopPropagation();
  const sub = document.getElementById(subtreeId);
  const ft  = document.getElementById(footerId);
  if (!sub) return;
  const isHidden = sub.style.display==='none';
  sub.style.display = isHidden ? 'block' : 'none';

  // Sandra always-visible: hide when Mike expands to avoid duplicate
  if (sub.innerHTML.includes('Sandra Gerstel')) {
    const sa = document.getElementById('sandra-always');
    if (sa) sa.style.display = isHidden ? 'none' : 'block';
  }

  if (ft) {
    ft.classList.toggle('expanded', isHidden);
    ft.querySelector('.cf-arrow').textContent = isHidden ? '∧' : '∨';
  }

  if (isHidden) {
    setTimeout(()=>{
      const sr=stage.getBoundingClientRect();
      const subR=sub.getBoundingClientRect();
      let ntx=tx,nty=ty;
      if(subR.bottom>sr.bottom-40) nty=ty-(subR.bottom-sr.bottom+60);
      if(subR.right >sr.right -20) ntx=tx-(subR.right -sr.right +40);
      if(ntx!==tx||nty!==ty) animateTo(ntx,nty,sc);
    },30);
  } else {
    if(!document.querySelectorAll('.card-footer.expanded').length) goHome();
  }
  drawMM();
}

document.getElementById('expand-all-btn').addEventListener('click', ()=>{
  allExpanded = !allExpanded;
  document.querySelectorAll('.card-footer').forEach(ft=>{
    const m=(ft.getAttribute('onclick')||'').match(/tog\('([^']+)'/);
    if(!m) return;
    const sub=document.getElementById(m[1]);
    if(!sub) return;
    sub.style.display = allExpanded ? 'block' : 'none';
    ft.classList.toggle('expanded', allExpanded);
    const arr=ft.querySelector('.cf-arrow');
    if(arr) arr.textContent = allExpanded ? '∧' : '∨';
    // Sandra always-visible
    if(sub.innerHTML.includes('Sandra Gerstel')) {
      const sa=document.getElementById('sandra-always');
      if(sa) sa.style.display = allExpanded ? 'none' : 'block';
    }
  });
  document.getElementById('expand-all-btn').innerHTML =
    `<span>${allExpanded?'∨':'∧'}</span> ${allExpanded?'Collapse all':'Expand all'}`;
  drawMM();
  if(!allExpanded) {
    goHome();
  } else {
    setTimeout(()=>{
      const sw=stage.clientWidth,sh=stage.clientHeight;
      const ww=world.scrollWidth,wh=world.scrollHeight;
      const nSc=Math.min(sw/ww,sh/wh,1)*0.88;
      animateTo((sw-ww*nSc)/2,20,nSc);
    },30);
  }
});

// ── PAN & ZOOM ────────────────────────────────────────────────────────────────
const stage=document.getElementById('stage');
let tx=0,ty=0,sc=1,isDrag=false,lx=0,ly=0;

function applyT(){
  world.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
  document.getElementById('zoom-lbl').textContent=Math.round(sc*100)+'%';
  drawMM();
}
function fit(){
  setTimeout(()=>{
    const sw=stage.clientWidth,sh=stage.clientHeight;
    const ww=world.scrollWidth,wh=world.scrollHeight;
    const nSc=Math.min(sw/ww,sh/wh,1)*0.88;
    animateTo((sw-ww*nSc)/2,20,nSc);
  },30);
}

stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const d=e.deltaY>0?0.9:1.1,r=stage.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const ns=Math.max(0.1,Math.min(3,sc*d));
  tx=mx-(mx-tx)*(ns/sc); ty=my-(my-ty)*(ns/sc); sc=ns; applyT();
},{passive:false});

stage.addEventListener('mousedown',e=>{
  if(e.target.closest('.person-card,.dept-card,.card-footer')) return;
  isDrag=true; lx=e.clientX; ly=e.clientY; stage.classList.add('dragging');
});
window.addEventListener('mousemove',e=>{
  if(!isDrag) return;
  tx+=e.clientX-lx; ty+=e.clientY-ly; lx=e.clientX; ly=e.clientY; applyT();
});
window.addEventListener('mouseup',()=>{isDrag=false; stage.classList.remove('dragging');});

let tch=[],iD=0,iSc=1,iTx=0,iTy=0;
stage.addEventListener('touchstart',e=>{tch=[...e.touches];if(tch.length===2){iD=Math.hypot(tch[0].clientX-tch[1].clientX,tch[0].clientY-tch[1].clientY);iSc=sc;iTx=tx;iTy=ty;}},{passive:true});
stage.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&tch.length===1){tx+=e.touches[0].clientX-tch[0].clientX;ty+=e.touches[0].clientY-tch[0].clientY;tch=[...e.touches];applyT();}
  else if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),ns=Math.max(0.1,Math.min(3,iSc*d/iD)),cx2=(e.touches[0].clientX+e.touches[1].clientX)/2,cy2=(e.touches[0].clientY+e.touches[1].clientY)/2,r=stage.getBoundingClientRect();tx=cx2-r.left-(cx2-r.left-iTx)*(ns/iSc);ty=cy2-r.top-(cy2-r.top-iTy)*(ns/iSc);sc=ns;applyT();}
  e.preventDefault();},{passive:false});

document.getElementById('zoom-in').addEventListener('click',()=>{sc=Math.min(3,sc*1.2);tx=stage.clientWidth/2-(stage.clientWidth/2-tx)*1.2;ty=stage.clientHeight/2-(stage.clientHeight/2-ty)*1.2;applyT();});
document.getElementById('zoom-out').addEventListener('click',()=>{sc=Math.max(0.1,sc/1.2);tx=stage.clientWidth/2-(stage.clientWidth/2-tx)/1.2;ty=stage.clientHeight/2-(stage.clientHeight/2-ty)/1.2;applyT();});
document.getElementById('zoom-fit').addEventListener('click',fit);

// ── TOOLTIP ───────────────────────────────────────────────────────────────────
const tooltip=document.getElementById('tooltip');
function showTip(e,name){
  if(isDrag) return;
  const disc=DISC_STYLES[name], resp=RESPONSIBILITIES[name], loc=LOCATION[name];
  tooltip.innerHTML=`
    <div class="tt-name">${name}${disc?` <span style="font-size:0.63rem;color:var(--text-dim)">(${disc})</span>`:''}</div>
    ${loc?`<div class="tt-meta"><b>Location:</b> ${loc.state} · ${loc.tz}</div>`:''}
    ${resp?`<hr><div class="tt-rlabel">Key Responsibilities</div>${resp.map(r=>`<div class="tt-ri">${r}</div>`).join('')}`:''}
    <div class="tt-hint">Click to view DISC profile →</div>`;
  tooltip.classList.add('show'); moveTip(e);
}
function moveTip(e){
  const x=e.clientX+14,y=e.clientY-8;
  tooltip.style.left=Math.min(x,window.innerWidth-285)+'px';
  tooltip.style.top=Math.min(y,window.innerHeight-tooltip.offsetHeight-10)+'px';
}
function hideTip(){tooltip.classList.remove('show');}

// ── DISC MODAL ────────────────────────────────────────────────────────────────
const overlay=document.getElementById('modal-overlay');
const modalBody=document.getElementById('modal-body');
function showModal(name){
  hideTip();
  const style=DISC_STYLES[name];
  const p=style?DISC_PROFILES[style]:null;
  if(!style||!p){
    // No DISC profile yet — show a placeholder modal
    const avatar=AVATARS[name]||'';
    const fb=`https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=0071CE&color=fff&size=80`;
    const allPeople2=[{name:"Wally Edwards",role:"VP, Growth & Development (LT)"},...TREE.children.flatMap(d=>d.children),...TREE_MIKE.children,...TREE_MIKE.children.flatMap(c=>c.children||[]),...TREE.children.flatMap(d=>d.children.flatMap(p=>[p,...(p.children||[]),...(p.children||[]).flatMap(c=>c.children||[])]))];
    const role2=allPeople2.find(c=>c.name===name)?.role||'';
    const lt=LT_PEOPLE.has(name)?'<span class="lt-badge" style="font-size:0.6rem;">LT</span>':'';
    modalBody.innerHTML=`<div class="m-avatar-row"><img class="m-avatar" src="${avatar}" onerror="this.src='${fb}'" alt="${name}"><div><div class="m-name">${name} ${lt}</div><div class="m-title">${role2}</div></div></div><div style="text-align:center;padding:24px 0;color:var(--text-dim);font-size:0.82rem;font-weight:600;">DISC profile coming soon</div>`;
    overlay.classList.add('open');
    return;
  }
  const avatar=AVATARS[name]||'';
  const fb=`https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=0071CE&color=fff&size=80`;
  const cls={D:'db-D',I:'db-I',i:'db-i',S:'db-S',C:'db-C',Di:'db-Di',Si:'db-Si',DC:'db-DC',SC:'db-SC',CD:'db-CD'}[style]||'db-D';
  const lt=LT_PEOPLE.has(name)?'<span class="lt-badge" style="font-size:0.6rem;">LT</span>':'';
  const allPeople = [
    {name:"Adam Garone",role:"CEO (LT)"},
    {name:"Wally Edwards",role:"VP, Growth & Development (LT)"},
    ...TREE.children.flatMap(d=>d.children),
    ...TREE_MIKE.children,
    ...TREE_MIKE.children.flatMap(c=>c.children||[]),
    ...TREE.children.flatMap(d=>d.children.flatMap(p=>[p,...(p.children||[]),...(p.children||[]).flatMap(c=>c.children||[])]))
  ];
  const role = allPeople.find(c=>c.name===name)?.role||'';
  modalBody.innerHTML=`
    <div class="m-avatar-row">
      <img class="m-avatar" src="${avatar}" onerror="this.src='${fb}'" alt="${name}">
      <div><div class="m-name">${name} ${lt}</div><div class="m-title">${role}</div></div>
    </div>
    <div class="disc-card" style="background:${p.bg};border:1.5px solid ${p.color}44">
      <div class="disc-card-hdr">
        <div class="disc-big ${cls}" style="background:${p.color}">${style}</div>
        <div><div class="disc-sname" style="color:${p.color}">${p.name}</div><div class="disc-ssub">DISC Communication Style</div></div>
      </div>
      <div class="disc-desc">${p.desc}</div>
      <div class="disc-traits">${p.traits.map(t=>`<span class="disc-trait" style="background:${p.color}18;color:${p.color}">${t}</span>`).join('')}</div>
    </div>`;
  overlay.classList.add('open');
}
document.getElementById('modal-close').addEventListener('click',()=>overlay.classList.remove('open'));
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('open');});

// ── MINIMAP ───────────────────────────────────────────────────────────────────
const mmC=document.getElementById('mm-canvas'),mmCtx=mmC.getContext('2d'),mmEl=document.getElementById('minimap');
function drawMM(){
  const mw=mmEl.clientWidth,mh=mmEl.clientHeight;
  mmC.width=mw*devicePixelRatio; mmC.height=mh*devicePixelRatio;
  mmCtx.scale(devicePixelRatio,devicePixelRatio); mmCtx.clearRect(0,0,mw,mh);
  const ww=world.scrollWidth,wh=world.scrollHeight;
  const ms=Math.min(mw/ww,mh/wh)*0.9;
  document.querySelectorAll('.person-card,.dept-card').forEach(card=>{
    const r=card.getBoundingClientRect(),sr=stage.getBoundingClientRect();
    const wx=(r.left-sr.left-tx)/sc,wy=(r.top-sr.top-ty)/sc;
    mmCtx.fillStyle='rgba(0,113,206,0.35)';
    mmCtx.fillRect(wx*ms,wy*ms,r.width/sc*ms,r.height/sc*ms);
  });
  mmCtx.strokeStyle='rgba(255,221,0,0.9)'; mmCtx.lineWidth=1.5;
  mmCtx.strokeRect((-tx/sc)*ms,(-ty/sc)*ms,(stage.clientWidth/sc)*ms,(stage.clientHeight/sc)*ms);
}
mmEl.addEventListener('click',e=>{
  const r=mmEl.getBoundingClientRect(),ww=world.scrollWidth,wh=world.scrollHeight;
  const ms=Math.min(mmEl.clientWidth/ww,mmEl.clientHeight/wh)*0.9;
  tx=stage.clientWidth/2-((e.clientX-r.left)/ms)*sc;
  ty=stage.clientHeight/2-((e.clientY-r.top)/ms)*sc; applyT();
});

window.addEventListener('load',()=>{ setTimeout(()=>{
  const sw=stage.clientWidth,ww=world.scrollWidth;
  sc=0.87; tx=(sw-ww*sc)/2; ty=40;
  homeT={tx,ty,sc}; applyT(); drawMM();
},100);});
window.addEventListener('resize',()=>{
  const sw=stage.clientWidth,ww=world.scrollWidth;
  sc=0.87; tx=(sw-ww*sc)/2; ty=40;
  homeT={tx,ty,sc}; applyT(); drawMM();
});

</script>
</body>
</html>
